name: 취약점 소식 수집

on:
  schedule:
    - cron: "23 * * * *"   # 매시 23분 (UTC 기준, 한국 시간으로도 매시 23분)
  workflow_dispatch:        # Actions 화면에서 "Run workflow" 로 직접 실행
  push:
    branches: [main]
    paths: ["collect.py", "docs/index.html", ".github/workflows/collect.yml"]

permissions:
  contents: write    # 수집 결과(docs/data.json) 커밋
  pages: write       # GitHub Pages 배포
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 수집
        run: python3 collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 새 항목이 있으면 저장소에 기록
        run: |
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "새 항목 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "수집: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
